    <dialog class="drawing-dialog" aria-labelledby="drawing-dialog-title">
        <button class="dialog-close" type="button" aria-label="Sluiten">&times;</button>
        <div class="dialog-content">
            <img id="drawing-dialog-image" src="" alt="">
            <div class="dialog-copy">
                <p class="eyebrow">Tkening in de galerie</p>
                <h2 id="drawing-dialog-title"></h2>
                <p id="drawing-dialog-description"></p>
            </div>
        </div>
    </dialog>

    <script>
        const dialog = document.querySelector('.drawing-dialog');
        const openButtons = document.querySelectorAll('.drawing-open');
        const dialogImage = document.querySelector('#drawing-dialog-image');
        const dialogTitle = document.querySelector('#drawing-dialog-title');
        const dialogDescription = document.querySelector('#drawing-dialog-description');
        const closeButton = document.querySelector('.dialog-close');

        openButtons.forEach((button) => {
            button.addEventListener('click', () => {
                const image = button.querySelector('img');
                dialogImage.src = image.src;
                dialogImage.alt = image.alt;
                dialogTitle.textContent = button.dataset.title;
                dialogDescription.textContent = button.dataset.description;
                dialog.showModal();
            });
        });

        closeButton.addEventListener('click', () => dialog.close());
        dialog.addEventListener('click', (event) => {
            if (event.target === dialog) {
                dialog.close();
            }
        });
    </script>
